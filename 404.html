<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — AERO</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(120% 120% at 50% 0%, #1a1a1d 0%, #0e0e10 55%, #08090a 100%);
      color: #f1eee7;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .code {
      margin: 0;
      font-weight: 800;
      font-size: clamp(96px, 24vw, 220px);
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #f1eee7 0%, rgba(241, 238, 231, 0.25) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.hint { color: rgba(241, 238, 231, 0.6); max-width: 36ch; margin: 12px auto 28px; font-size: 15px; }
    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      border: 1px solid rgba(169, 188, 255, 0.4);
      color: #a9bcff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 0.02em;
      transition: background 160ms ease, color 160ms ease;
    }
    a:hover, a:focus-visible { background: #a9bcff; color: #0e0e10; outline: none; }
    @media (prefers-reduced-motion: no-preference) {
      .code { animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <p class="hint">This page took a detour. The studio, the hangar, and all thirteen shoes are one click away.</p>
    <a href="/">Back to the studio</a>
  </main>
</body>
</html>
